[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "chassis-parser"
version = "0.1.0"
description = "Analizador léxico y sintáctico del DSL declarativo Chassis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
chassis = "chassis.cli:main"

[tool.setuptools]
packages = ["chassis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
